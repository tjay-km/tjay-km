name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 05:17 SAST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects.json
      - scripts/build_profile.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README and stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile projects and stats"
            git push
          fi
